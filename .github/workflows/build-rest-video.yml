name: Build FitTrack recovery MP4
on:
  push:
    paths:
      - scripts/build_rest_video.py
      - .github/workflows/build-rest-video.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install video tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python3 -m pip install --user Pillow
      - name: Render video
        run: python3 scripts/build_rest_video.py
      - name: Commit MP4 to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/exercise-videos/descanso-fittrack.mp4
          if ! git diff --cached --quiet; then
            git commit -m "Generate FitTrack rest MP4 for Coach Live"
            git push
          fi
